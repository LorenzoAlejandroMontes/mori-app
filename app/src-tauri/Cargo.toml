[package]
name = "mori"
version = "0.1.0"
description = "Mori, companion note-taker"
authors = ["Lorenzo Alejandro Montes"]
edition = "2021"

[lib]
name = "mori_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon + image-png: Mori vive nella barra di Windows e disegna la variante
# "sto registrando" partendo dai pixel dell'icona dell'app (vedi companion.rs).
# macos-private-api: the status pill is a transparent window, and on macOS
# Tauri only exposes `.transparent()` behind this feature (it pairs with
# `app.macOSPrivateApi` in tauri.conf.json). It changes nothing on Windows.
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = { version = "2" }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Lo stesso SHA-384 che sqlx salva in _sqlx_migrations: il test in lib.rs
# controlla che i file delle migrazioni non cambino byte.
[dev-dependencies]
sha2 = "0.10"

# Only Windows needs it (foreground window title for the call banner); the
# backend also builds on macOS/Linux for CI and contributors (see platform.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
