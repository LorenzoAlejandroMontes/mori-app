name: macOS app

# docs/MACOS.md, M1 to M5: a Mac app comes out of CI. The job builds Mori.app
# and a .dmg for Apple Silicon, checks what is inside, then uses the app taken
# from the .dmg the way a person would: first launch with no Python anywhere
# (Mori prepares its own), a recording started with the global shortcut, the
# transcript, Cmd+Q in the middle of a call.
# The app is signed ad hoc: no certificate, no secret.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-latest
    timeout-minutes: 50
    defaults:
      run:
        # bash here means "bash -eo pipefail": a failed check behind a pipe fails the step.
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Results folder
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          echo "R=$RUNNER_TEMP/results" >> "$GITHUB_ENV"

      # Tauri bundles the helper as an external binary: it has to exist first.
      - name: Build mori-sysaudio
        run: |
          bash native/mori-sysaudio/build.sh
          ls -l native/mori-sysaudio/build

      # uv travels inside the app too: on first launch it makes Mori's Python.
      - name: Fetch uv
        run: |
          bash native/uv/fetch.sh
          ls -l native/uv/build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Build Mori.app and the .dmg
        run: |
          pnpm exec tauri build --config src-tauri/tauri.macos-app.conf.json --bundles app,dmg
          B="$PWD/src-tauri/target/release/bundle"
          ls -l "$B/macos" "$B/dmg"
          DMG=$(ls "$B"/dmg/*.dmg | head -1)
          echo "BUILT_APP=$B/macos/Mori.app" >> "$GITHUB_ENV"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Mori-macos-apple-silicon-dmg
          path: ${{ env.DMG }}
          if-no-files-found: error
          retention-days: 14

      # From here on, everything looks at the app a user would get: the one
      # copied out of the .dmg, not the build folder.
      - name: Take the app out of the .dmg
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$DMG"
          ls -la "$RUNNER_TEMP/dmg"
          mkdir -p "$RUNNER_TEMP/installed"
          ditto "$RUNNER_TEMP/dmg/Mori.app" "$RUNNER_TEMP/installed/Mori.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
          echo "APP=$RUNNER_TEMP/installed/Mori.app" >> "$GITHUB_ENV"

      - name: What is inside Mori.app
        run: |
          {
            echo "## files"
            (cd "$APP" && find . -not -name "*.png" | sort)
            echo "## Info.plist"
            plutil -lint "$APP/Contents/Info.plist"
            plutil -p "$APP/Contents/Info.plist"
          } | tee "$R/bundle.txt"
          PB=/usr/libexec/PlistBuddy
          echo "## the checks"
          test -x "$APP/Contents/MacOS/mori-sysaudio"
          file "$APP/Contents/MacOS/mori-sysaudio" | grep arm64
          test -x "$APP/Contents/MacOS/uv"
          "$APP/Contents/MacOS/uv" --version
          for f in record.py transcribe.py transcribe_cloud.py transcribe_diarized.py whisper_common.py progress_file.py embed.py toflac.py; do
            test -f "$APP/Contents/Resources/scripts/$f" || { echo "missing scripts/$f"; exit 1; }
          done
          cmp "$APP/Contents/Resources/scripts/record.py" scripts/record.py
          cmp "$APP/Contents/Resources/requirements.txt" requirements.txt
          MIC=$($PB -c "Print :NSMicrophoneUsageDescription" "$APP/Contents/Info.plist")
          SYS=$($PB -c "Print :NSAudioCaptureUsageDescription" "$APP/Contents/Info.plist")
          MIN=$($PB -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist")
          ID=$($PB -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist")
          echo "microphone: $MIC"; echo "audio capture: $SYS"; echo "minimum macOS: $MIN"; echo "identifier: $ID"
          [ -n "$MIC" ] && [ -n "$SYS" ]
          [ "$MIN" = "14.2" ]
          [ "$ID" = "com.mori.app" ]
          echo "## signature of the app"
          codesign -dvv "$APP" 2>&1 | tee "$R/codesign_app.txt"
          grep -q "^Signature=adhoc" "$R/codesign_app.txt"
          echo "## signature of the helper inside it"
          codesign -dvv "$APP/Contents/MacOS/mori-sysaudio" 2>&1 | tee "$R/codesign_helper.txt"
          grep -q "^Signature=adhoc" "$R/codesign_helper.txt"
          # Not needed to capture here (run 37636489147 heard the sentence with and
          # without it); it is checked because the config asks for it.
          echo "## what the helper is entitled to"
          codesign -d --entitlements - "$APP/Contents/MacOS/mori-sysaudio" 2>&1 | tee "$R/entitlements_helper.txt"
          grep -q "com.apple.security.device.audio-input" "$R/entitlements_helper.txt"
          echo "## deep verification"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "all bundle checks passed"

      - name: A sentence to play
        run: |
          say -o "$R/speech.aiff" "[[slnc 500]] Hello Sarah, the meeting moved to Thursday at three. Can you bring the slides?"
          afconvert -f WAVE -d LEI16@16000 -c 1 "$R/speech.aiff" "$R/speech.wav"
          osascript -e "set volume output volume 60" || true

      # On a user's Mac these are the two system prompts ("Mori would like to
      # use the microphone", "...to record this computer's audio"). A CI machine
      # has nobody to click them, and an unanswered prompt blocks every later
      # capture, so the answers are written where macOS keeps them BEFORE the
      # first capture: for whoever launches things from this shell, for the
      # helper by path, and for the app by its identifier.
      - name: Allow the microphone and system audio recording
        run: |
          BIN="$APP/Contents/MacOS/mori-sysaudio"
          SQL="CREATE TEMP TABLE t AS SELECT * FROM access WHERE service IN ('kTCCServiceMicrophone','kTCCServiceScreenCapture') GROUP BY client;
               UPDATE t SET service='kTCCServiceAudioCapture', auth_value=2;
               INSERT OR REPLACE INTO access SELECT * FROM t;
               CREATE TEMP TABLE b AS SELECT * FROM t WHERE client LIKE '/%' LIMIT 1;
               UPDATE b SET client='$BIN', csreq=NULL;
               INSERT OR REPLACE INTO access SELECT * FROM b;
               UPDATE b SET client='com.mori.app', client_type=0;
               INSERT OR REPLACE INTO access SELECT * FROM b;
               UPDATE b SET service='kTCCServiceMicrophone';
               INSERT OR REPLACE INTO access SELECT * FROM b;
               SELECT service, client, client_type, auth_value FROM access ORDER BY service, client;"
          echo "## system"; sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "$SQL" | tee "$R/tcc_system.txt"
          echo "## user"; sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "$SQL" | tee "$R/tcc_user.txt"

      # docs/MACOS.md, M5: no Python to install. This job never sets one up:
      # there is no ~/.mori/venv, and an app opened from Finder does not see the
      # shell's PATH. Mori has to prepare its own environment with the uv
      # inside the app, and say how far it is while it does.
      - name: First launch, Mori prepares its own Python
        run: |
          [ ! -e "$HOME/.mori/venv" ] || { echo "there is already a ~/.mori/venv: this would prove nothing"; exit 1; }
          # The app looks for scripts next to its source folder first. On this
          # machine that folder exists; hide it so the app can only use its own.
          mv scripts scripts.checkout
          # The PATH of an app opened from Finder: none of this shell's Pythons.
          open --env PATH=/usr/bin:/bin:/usr/sbin:/sbin --stdout "$R/app.out" --stderr "$R/app.err" "$APP"
          PYV="$HOME/.mori/venv/bin/python"
          SHOT=0
          # A screenshot a second while it works: on this network the whole
          # setup takes a few seconds.
          for i in $(seq 1 400); do
            if [ -f "$HOME/.mori/setup.log" ] && [ $SHOT -lt 20 ]; then SHOT=$((SHOT + 1)); screencapture -x "$R/setup_$SHOT.png"; fi
            if grep -q "^## check" "$HOME/.mori/setup.log" 2>/dev/null && "$PYV" -c "import soundcard, numpy, faster_whisper" 2>/dev/null; then break; fi
            sleep 1
          done
          echo "## what the app could see"
          PID=$(pgrep -f "Mori.app/Contents/MacOS/mori$" | head -1)
          ps eww -o command= -p "$PID" | tr ' ' '\n' | grep -E "^(PATH|HOME)=" | tee "$R/app_env.txt" || true
          echo "## the setup log (~/.mori/setup.log)"
          cat "$HOME/.mori/setup.log" | tee "$R/setup.log"
          echo "## the environment Mori made"
          "$PYV" -c "import sys, soundcard, numpy, faster_whisper; print('imports ok,', sys.version); print(sys.executable)" | tee "$R/setup_python.txt"
          ls "$HOME/.mori"; du -sh "$HOME/.mori/venv" "$HOME/.mori/python" | tee "$R/setup_sizes.txt"
          grep -q "$HOME/.mori/python" <(readlink "$HOME/.mori/venv/bin/python" || "$PYV" -c "import sys; print(sys.base_prefix)") || { echo "the venv is not built on Mori's own Python"; exit 1; }
          sleep 4
          screencapture -x "$R/setup_ready.png"
          echo "## quit (Cmd+Q, nothing recording)"
          osascript -e 'tell application "System Events" to tell process "mori" to set frontmost to true' 2>&1 || true
          sleep 1
          osascript -e 'tell application "System Events" to keystroke "q" using {command down}' 2>&1 || echo "could not send Cmd+Q"
          for i in $(seq 1 50); do pgrep -f "Mori.app/Contents/MacOS/mori$" > /dev/null || break; sleep 0.2; done
          pgrep -fl "Mori.app/Contents/MacOS/mori$" && { echo "Mori did not quit: stopping it"; pkill -f "Mori.app/Contents/MacOS/mori$" || true; } || echo "Mori quit"
          mv scripts.checkout scripts
          echo "PY=$PYV" >> "$GITHUB_ENV"
          echo "Mori prepared its own Python"

      # The recorder and the helper are the ones inside the app, run by the
      # Python Mori just made. No environment variable tells record.py where
      # the helper is: it has to find it.
      - name: The recorder inside the app hears the other side
        run: |
          REC="$APP/Contents/Resources/scripts/record.py"
          attempt() {
            N=$1; OUT="$R/packaged_$N.wav"; STOP="$R/packaged_$N.stop"
            (cd "$RUNNER_TEMP" && env -u MORI_SYSAUDIO "$PY" "$REC" "$OUT" "$STOP" 60 > "$R/packaged_$N.out" 2> "$R/packaged_$N.err") &
            P=$!
            for i in $(seq 1 100); do [ -f "$OUT.started" ] && break; sleep 0.2; done
            [ -f "$OUT.started" ] || { echo "the recorder did not start"; cat "$R/packaged_$N.err"; return 1; }
            sleep 2
            echo "## the helper that is running"
            pgrep -fl mori-sysaudio | tee "$R/packaged_helper_$N.txt" || true
            S=$(date +%s)
            afplay "$R/speech.wav"
            echo "playing the sentence took $(( $(date +%s) - S )) s (it is about 5 s long)"
            sleep 2
            touch "$STOP"
            wait $P || echo "recorder exit code $?"
            echo "## recorder said"; cat "$R/packaged_$N.out" "$R/packaged_$N.err"
            grep -q "$APP/Contents/MacOS/mori-sysaudio" "$R/packaged_helper_$N.txt" || { echo "the helper inside the app was not the one running"; return 1; }
            echo "## the others' channel"
            "$PY" native/mori-sysaudio/ci_check.py "$OUT.sys.wav" meeting thursday slides | tee "$R/packaged_others.json"
          }
          if attempt 1; then exit 0; fi
          # Seen in 2 runs: both channels come back all zeros and shorter than
          # the time that passed (3 to 4 s of samples for about 9 s of clock).
          # That is this machine's sound system not running, before Mori is
          # involved: restart it, and the permission daemon, then try again.
          echo "## first attempt failed: what macOS decided about the permission"
          log show --last 2m --style compact --predicate 'subsystem == "com.apple.TCC"' 2>/dev/null | grep -i -E "AudioCapture|sysaudio" | tail -40 || true
          echo "## the sound devices at this moment"
          system_profiler SPAudioDataType || true
          for N in 2 3; do
            echo "## restarting the sound system and the permission daemon, attempt $N"
            sudo killall coreaudiod || true
            sudo killall tccd || true
            killall tccd || true
            sleep 6
            osascript -e "set volume output volume 60" || true
            if attempt $N; then exit 0; fi
          done
          exit 1

      # docs/MACOS.md, M3: honest states. When the helper is not there, or
      # stops in the middle of a call, the recorder says so in the file the
      # interface reads (<wav>.levels, "errs"), and your side keeps recording.
      - name: Without the helper, Mori says so and keeps your side
        run: |
          ditto "$APP" "$RUNNER_TEMP/nohelper/Mori.app"
          rm "$RUNNER_TEMP/nohelper/Mori.app/Contents/MacOS/mori-sysaudio"
          one() {
            NAME=$1; REC=$2; KILL=$3; EXPECT=$4
            OUT="$R/$NAME.wav"; STOP="$R/$NAME.stop"
            (cd "$RUNNER_TEMP" && env -u MORI_SYSAUDIO "$PY" "$REC" "$OUT" "$STOP" 60 > "$R/$NAME.out" 2> "$R/$NAME.err") &
            P=$!
            for i in $(seq 1 100); do [ -f "$OUT.started" ] && break; sleep 0.2; done
            [ -f "$OUT.started" ] || { echo "$NAME: the recorder did not start"; cat "$R/$NAME.err"; return 1; }
            sleep 2
            if [ "$KILL" = yes ]; then echo "## stopping the helper in the middle"; pkill -9 -f "MacOS/mori-sysaudio" || true; fi
            sleep 3
            echo "## $NAME: what the interface reads while recording"
            cp "$OUT.levels" "$R/$NAME.levels.json"; cat "$R/$NAME.levels.json"; echo
            touch "$STOP"
            wait $P; CODE=$?
            echo "## $NAME: recorder exit code $CODE, said:"; cat "$R/$NAME.out" "$R/$NAME.err"
            [ "$CODE" = 0 ] || { echo "$NAME: the recorder crashed"; return 1; }
            grep -q "\"sys: $EXPECT" "$R/$NAME.levels.json" || { echo "$NAME: the levels do not say the other side is gone"; return 1; }
            [ -f "$OUT.done" ] || { echo "$NAME: the recording was not closed"; return 1; }
            "$PY" -c "import sys, wave; w = wave.open(sys.argv[1]); s = w.getnframes() / w.getframerate(); print('your side:', w.getframerate(), 'Hz,', w.getnchannels(), 'channel,', round(s, 1), 's'); sys.exit(0 if w.getframerate() == 16000 and w.getnchannels() == 1 and s >= 4 else 1)" "$OUT.mic.wav" | tee "$R/$NAME.mic.txt"
          }
          set +e
          one nohelper "$RUNNER_TEMP/nohelper/Mori.app/Contents/Resources/scripts/record.py" no "mori-sysaudio not found"; A=$?
          one helpergone "$APP/Contents/Resources/scripts/record.py" yes "mori-sysaudio stopped"; B=$?
          set -e
          [ "$A" = 0 ] && [ "$B" = 0 ] || exit 1
          echo "without the helper the recorder says so, and your side is still recorded"

      # The whole app, as a user would run it: opened from Finder's point of
      # view, started and stopped with the global shortcut. This step and the
      # two after it report; they do not decide whether the job is green:
      # driving a window on a CI machine is the fragile part.
      - name: The app itself, opened and driven with its shortcut
        id: live
        continue-on-error: true
        run: |
          mv scripts scripts.checkout
          T=$(getconf DARWIN_USER_TEMP_DIR)
          rm -f "$T"/mori_rec_* || true
          open --env PATH=/usr/bin:/bin:/usr/sbin:/sbin --stdout "$R/app.out" --stderr "$R/app.err" "$APP"
          sleep 12
          echo "## processes"; pgrep -fl "Mori.app" || { echo "the app is not running"; cat "$R/app.err" || true; exit 1; }
          screencapture -x "$R/app_open.png"
          echo "## windows"
          osascript -e 'tell application "System Events" to get {name, position, size} of every window of process "mori"' 2>&1 || true
          # The menu behind the menu bar icon, in the language of the interface.
          osascript -e 'tell application "System Events" to tell process "mori" to click menu bar item 1 of menu bar 2' 2>&1 || echo "could not open the menu bar icon's menu"
          sleep 1
          screencapture -x "$R/app_menu_bar_icon.png"
          osascript -e 'tell application "System Events" to key code 53' 2>&1 || true
          sleep 1
          # Settings (Cmd+,), then back to Today (Cmd+1): one more page to look at.
          osascript -e 'tell application "System Events" to tell process "mori" to set frontmost to true' 2>&1 || true
          osascript -e 'tell application "System Events" to keystroke "," using {command down}' 2>&1 || true
          sleep 2
          screencapture -x "$R/app_settings.png"
          osascript -e 'tell application "System Events" to keystroke "1" using {command down}' 2>&1 || true
          sleep 1

          echo "## shortcut: start"
          osascript -e 'tell application "System Events" to key code 15 using {command down, shift down}' 2>&1 || echo "could not send the shortcut"
          STARTED=""
          for i in $(seq 1 150); do STARTED=$(ls "$T"/mori_rec_*.wav.started 2>/dev/null | head -1 || true); [ -n "$STARTED" ] && break; sleep 0.2; done
          echo "## what the app said"; cat "$R/app.out" "$R/app.err" 2>/dev/null || true
          ls -la "$T" | grep mori_rec || true
          [ -n "$STARTED" ] || { echo "no recording started after the shortcut"; screencapture -x "$R/app_no_recording.png"; exit 1; }
          WAV="${STARTED%.started}"
          sleep 2
          echo "## recorder and helper started by the app"
          pgrep -fl "record.py" | tee "$R/live_recorder.txt" || true
          pgrep -fl "mori-sysaudio" | tee "$R/live_helper.txt" || true
          afplay "$R/speech.wav" &
          A=$!
          sleep 4
          screencapture -x "$R/app_recording.png"
          cat "$WAV.levels" 2>/dev/null | tee "$R/live_levels.json" || true
          echo
          wait $A
          sleep 2
          echo "## shortcut: stop"
          osascript -e 'tell application "System Events" to key code 15 using {command down, shift down}' 2>&1 || echo "could not send the shortcut"
          # The app deletes the channel files once the call is transcribed: copy
          # the others' channel the moment the recorder says it is done.
          for i in $(seq 1 300); do [ -f "$WAV.done" ] && break; sleep 0.1; done
          cp "$WAV.sys.wav" "$R/live_others.wav" 2>/dev/null || true
          cp "$WAV.mic.wav" "$R/live_you.wav" 2>/dev/null || true
          [ -f "$R/live_others.wav" ] || { echo "the recording did not finish"; ls -la "$T" | grep mori_rec || true; cat "$T"/mori_rec_*.log 2>/dev/null || true; exit 1; }
          sleep 3
          screencapture -x "$R/app_after_stop.png"
          cat "$T"/mori_rec_*.log 2>/dev/null || true
          echo "## the others' channel, recorded by the running app"
          "$PY" native/mori-sysaudio/ci_check.py "$R/live_others.wav" meeting thursday slides | tee "$R/live_others.json"
          grep -qE "$HOME/\.mori/(venv|python)/" "$R/live_recorder.txt" || { echo "the recorder was not run by the Python Mori prepared"; exit 1; }
          grep -q "$APP/Contents/Resources/scripts/record.py" "$R/live_recorder.txt" || { echo "the recorder was not the one inside the app"; exit 1; }
          grep -q "$APP/Contents/MacOS/mori-sysaudio" "$R/live_helper.txt" || { echo "the helper was not the one inside the app"; exit 1; }
          echo "the running app recorded the other side"

      # The call just recorded becomes text inside the app, with what a new
      # install has: no key, so the local Whisper (it downloads its model the
      # first time).
      - name: The app transcribes the call it recorded
        id: transcribe
        if: steps.live.outcome == 'success'
        continue-on-error: true
        run: |
          Q="select s.title, s.status, t.provider, t.model, replace(t.memo, char(10), ' / ') from session s join session_transcript t on t.session_id = s.id where t.provider != 'seed'"
          for i in $(seq 1 120); do
            sqlite3 "$HOME/.mori/mori.db" "$Q" > "$R/transcript_in_app.txt" 2>/dev/null || true
            grep -qi "thursday" "$R/transcript_in_app.txt" && break
            [ $((i % 6)) -eq 0 ] && { echo "waiting ($((i * 5)) s)"; sqlite3 "$HOME/.mori/mori.db" "select kind, status, attempts, coalesce(last_error, '') from job" 2>/dev/null || true; }
            [ "$i" = 4 ] && screencapture -x "$R/app_transcribing.png"
            sleep 5
          done
          echo "## what Mori wrote down"
          cat "$R/transcript_in_app.txt"
          sqlite3 "$HOME/.mori/mori.db" "select kind, status, attempts, coalesce(last_error, '') from job" | tee "$R/jobs_in_app.txt" || true
          sleep 3
          screencapture -x "$R/app_transcribed.png"
          grep -qi "thursday" "$R/transcript_in_app.txt" || { echo "the transcript did not arrive"; ls -la "$HOME/.mori" "$HOME/.cache/huggingface/hub" 2>/dev/null || true; exit 1; }
          grep -qi "slides" "$R/transcript_in_app.txt" || { echo "the transcript is not the sentence that was played"; exit 1; }
          echo "the app transcribed the call it recorded"

      # Cmd+Q in the middle of a call (docs/MACOS.md, M2): Mori stops the
      # recording, saves the call, then quits. Nothing is left running.
      - name: Cmd+Q during a call saves it first
        id: quit
        if: steps.live.outcome == 'success'
        continue-on-error: true
        run: |
          T=$(getconf DARWIN_USER_TEMP_DIR)
          rm -f "$T"/mori_rec_*.started
          osascript -e 'tell application "System Events" to key code 15 using {command down, shift down}' 2>&1 || echo "could not send the shortcut"
          SECOND=""
          for i in $(seq 1 150); do SECOND=$(ls "$T"/mori_rec_*.wav.started 2>/dev/null | head -1 || true); [ -n "$SECOND" ] && break; sleep 0.2; done
          [ -n "$SECOND" ] || { echo "the second recording did not start"; exit 1; }
          WAV2="${SECOND%.started}"
          sleep 4
          pgrep -fl "record.py" || true
          osascript -e 'tell application "System Events" to tell process "mori" to set frontmost to true' 2>&1 || true
          sleep 1
          screencapture -x "$R/app_before_quit.png"
          osascript -e 'tell application "System Events" to keystroke "q" using {command down}' 2>&1 || echo "could not send Cmd+Q"
          for i in $(seq 1 300); do pgrep -f "Mori.app/Contents/MacOS/mori$" > /dev/null || break; sleep 0.2; done
          sleep 1
          screencapture -x "$R/app_after_quit.png"
          echo "## what is still running (nothing should be)"
          if pgrep -fl "Mori.app/Contents/MacOS/mori$"; then
            echo "Mori is still running after Cmd+Q: what it is doing"
            sample "$(pgrep -f "Mori.app/Contents/MacOS/mori$" | head -1)" 2 -file "$R/mori_after_quit_sample.txt" > /dev/null 2>&1 || true
            head -120 "$R/mori_after_quit_sample.txt" || true
            sqlite3 "$HOME/.mori/mori.db" "select kind, status, attempts, coalesce(last_error, '') from job" || true
            exit 1
          fi
          pgrep -fl "record.py" && { echo "the recorder was left running"; exit 1; } || true
          pgrep -fl "mori-sysaudio" && { echo "the helper was left running"; exit 1; } || true
          [ -f "$WAV2.done" ] || { echo "the recorder was not stopped cleanly: no $WAV2.done"; ls -la "$T" | grep mori_rec || true; exit 1; }
          echo "## the calls Mori saved"
          sqlite3 "$HOME/.mori/mori.db" "select title, status from session where title like 'Recording%'" | tee "$R/calls_after_quit.txt"
          [ "$(wc -l < "$R/calls_after_quit.txt")" -ge 2 ] || { echo "the call recorded before Cmd+Q was not saved"; exit 1; }
          echo "Cmd+Q during a call: recording stopped and saved, nothing left running"

      - name: After the live run
        if: always()
        run: |
          {
            echo "live step: ${{ steps.live.outcome }}"
            echo "transcription in the app: ${{ steps.transcribe.outcome }}"
            echo "Cmd+Q during a call: ${{ steps.quit.outcome }}"
          } | tee "$R/live_outcome.txt"
          [ -d scripts.checkout ] && mv scripts.checkout scripts || true
          pkill -f "Mori.app/Contents/MacOS" || true
          ls -la "$HOME/.mori" "$HOME/.mori/audio" 2>/dev/null || true
          log show --last 8m --style compact --predicate 'subsystem == "com.apple.TCC"' 2>/dev/null | grep -i -E "AudioCapture|Microphone|sysaudio|com\.mori" | tail -80 > "$R/tcc_log.txt" || true
          tail -30 "$R/tcc_log.txt" || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Mori.app from the .dmg"
            echo '```'; cat "$R/live_outcome.txt" 2>/dev/null || true; echo '```'
            for f in packaged_others live_others; do
              if [ -f "$R/$f.json" ]; then echo "**$f**"; echo '```json'; cat "$R/$f.json"; echo '```'; fi
            done
            if [ -f "$R/transcript_in_app.txt" ]; then echo "**transcript in the app**"; echo '```'; cat "$R/transcript_in_app.txt"; echo '```'; fi
            if [ -f "$R/codesign_app.txt" ]; then echo '```'; cat "$R/codesign_app.txt"; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-app-results
          path: ${{ runner.temp }}/results
          retention-days: 14
